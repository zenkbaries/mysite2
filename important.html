<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        .image-box {
            margin-bottom: 20px;
            border: 1px solid #333;
            padding: 10px;
            background-color: #222;
            border-radius: 10px;
        }
        img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }
        .caption {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Gallery</h1>
        <p>Displaying 11 images</p>
        
        <!-- Loop through images -->
        <script>
            for (let i = 1; i <= 11; i++) {
                document.write(`
                    <div class="image-box">
                        <img src="/images/Image_${i}.jpg" alt="Image ${i}">
                        <div class="caption">${i}/11</div>
                    </div>
                `);
            }
        </script>
    </div>
</body>
</html>
